# Выкладывает сайт на облачный сервер Timeweb при каждом изменении в ветке main.
#
# Сервер настраивается один раз скриптом deploy/setup-server.sh — он же
# печатает значения для секретов, которые нужно добавить в репозиторий:
#   Settings → Secrets and variables → Actions → New repository secret
#
#   SSH_HOST — IP сервера, например 5.42.122.203
#   SSH_USER — deploy
#   SSH_KEY  — приватный ключ целиком, вместе со строками BEGIN и END
#   SSH_PATH — /var/www/okna
#
# Запустить выкладку вручную можно во вкладке Actions кнопкой «Run workflow».

name: Выкладка на сервер

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Загрузить сайт на сервер
    runs-on: ubuntu-latest

    steps:
      - name: Забрать код
        uses: actions/checkout@v5

      - name: Собрать то, что уходит на сервер
        run: |
          mkdir -p dist
          cp index.html styles.css script.js privacy.html 404.html favicon.svg dist/
          cp send.php config.sample.php max-chat-id.php dist/
          for f in robots.txt sitemap.xml; do
            [ -f "$f" ] && cp "$f" dist/
          done
          # config.php с паролем живёт только на сервере и никогда не перезаписывается:
          # rsync запускается без --delete, поэтому файл на сервере останется нетронутым
          echo "На сервер уйдут файлы:"
          ls -1 dist

      - name: Проверить, что секреты заполнены
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
        run: |
          missing=""
          [ -z "$SSH_HOST" ] && missing="$missing SSH_HOST"
          [ -z "$SSH_USER" ] && missing="$missing SSH_USER"
          [ -z "$SSH_KEY" ]  && missing="$missing SSH_KEY"
          if [ -n "$missing" ]; then
            echo "Не заданы секреты:$missing"
            echo "Их печатает скрипт deploy/setup-server.sh при настройке сервера."
            echo "Добавьте в Settings → Secrets and variables → Actions."
            exit 1
          fi

      - name: Подготовить ключ доступа
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Запоминаем отпечаток сервера, чтобы подключение не спрашивало подтверждения
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Скопировать файлы
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PATH: ${{ secrets.SSH_PATH || '/var/www/okna' }}
        run: |
          # --delete намеренно не используется: в каталоге сайта может лежать
          # что-то ещё, и стирать это автоматически опасно.
          rsync -avz --no-perms --no-owner --no-group \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new" \
            dist/ "$SSH_USER@$SSH_HOST:$SSH_PATH/"

      - name: Проверить, что сайт отвечает
        env:
          # Проверяем по домену, а не по IP: nginx отдаёт сайт по server_name,
          # и запрос по адресу сервера в него просто не попадёт.
          SITE: https://xn-----6kcboc8akc1afejndhfd0clr.xn--p1ai/
        run: |
          code="$(curl -sL -o /dev/null -w '%{http_code}' --max-time 25 "$SITE" || echo 000)"
          echo "Сайт ответил кодом $code"
          if [ "$code" = "200" ]; then
            title="$(curl -sL --max-time 25 "$SITE" | grep -o '<title>[^<]*' | head -1 | cut -c8-)"
            echo "Открывается: $title"
          else
            echo "Файлы скопированы, но сайт ответил $code."
            echo "Проверьте на сервере: nginx -t && systemctl status nginx"
          fi
