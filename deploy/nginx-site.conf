# Конфигурация nginx для сайта «Окна Профигрупп».
# Скрипт setup-server.sh кладёт этот файл в /etc/nginx/sites-available/okna
# и подставляет вместо __DOMAIN__ адрес сайта в латинице (punycode).
#
# Домен окна-курган-профигруп.рф в латинице выглядит так:
#   xn-----6kcboc8akc1afejndhfd0clr.xn--p1ai
# nginx понимает только такую запись, кириллицу он не принимает.

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__ www.__DOMAIN__;

    root /var/www/okna;
    index index.html;

    # Место для проверки Let's Encrypt при выпуске сертификата
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/okna;
        allow all;
    }

    # Certbot допишет сюда перенаправление на https после выпуска сертификата
    location / {
        try_files $uri $uri/ =404;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php-fpm.sock;
    }

    error_page 404 /404.html;

    # Служебные файлы наружу не отдаём
    location ~ /\.(?!well-known) { deny all; }
    location ~* \.(md|yml|yaml)$ { deny all; }

    # В config.php лежат пароль от почты и токен бота — наружу его нельзя
    # ни при каких условиях. max-chat-id.php — служебный, только из консоли.
    location ~* ^/(config(\.sample)?|max-chat-id)\.php$ { deny all; }

    # Журнал заявок лежит вне папки сайта, но закроем и по имени — на всякий случай
    location ~* ^/(okna-)?leads/ { deny all; }

    # Кэш статики: стили и скрипты меняются редко
    location ~* \.(css|js)$ {
        expires 7d;
        add_header Cache-Control "public";
    }

    location ~* \.(svg|png|jpg|jpeg|webp|ico|woff2)$ {
        expires 30d;
        add_header Cache-Control "public";
    }

    # Страницы не кэшируем, иначе после правок посетитель увидит старое
    location ~* \.html$ {
        expires -1;
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json text/plain;
    gzip_min_length 512;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    access_log /var/log/nginx/okna-access.log;
    error_log  /var/log/nginx/okna-error.log;
}
