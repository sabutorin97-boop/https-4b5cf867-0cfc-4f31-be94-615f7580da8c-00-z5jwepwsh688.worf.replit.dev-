# Прокси слушает только внутри docker-сети; наружу порт не публикуется.
Port 8888
Listen 0.0.0.0
Timeout 600

# Доступ только из приватных диапазонов docker-сетей
Allow 172.16.0.0/12
Allow 192.168.0.0/16
Allow 10.0.0.0/8

# CONNECT нужен для HTTPS к провайдерам
ConnectPort 443

# Не раскрываем сведения о клиенте наружу
DisableViaHeader Yes
ViaProxyName "egress"

LogLevel Warning
MaxClients 100
